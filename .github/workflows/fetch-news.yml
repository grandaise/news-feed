name: 뉴스 수집

on:
  schedule:
    # 매일 한국시간 06:00 ~ 23:00 사이 2시간마다 (UTC 기준 표기)
    - cron: "0 21,23,1,3,5,7,9,11,13 * * *"
  push:
    branches: [main]
    paths: [keywords.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RSS 수집
        run: node scripts/fetch.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
