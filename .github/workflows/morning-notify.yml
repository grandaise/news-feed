name: 아침 알림

on:
  schedule:
    # GitHub 예약 실행은 수십 분 늦게 시작되는 일이 잦아서
    # 한국시간 06:37(UTC 21:37)에 미리 시작해 두고 07:30까지 기다렸다가 보낸다
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.MY_DATA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 한국시간 07:30까지 대기
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Seoul date -d "today 07:30" +%s)
          wait=$(( target - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "$wait초 대기"
            sleep "$wait"
          else
            echo "이미 07:30이 지나 바로 보냅니다"
          fi
      - name: 최신 뉴스 수집
        run: node scripts/fetch.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
      - name: 개인 일정 읽기 (비공개 my-data, 읽기 전용 키)
        id: mydata
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/my-data
          ssh-key: ${{ secrets.MY_DATA_DEPLOY_KEY }}
          path: my-data
      - name: 핸드폰으로 알림 보내기
        env:
          MY_DATA_DIR: ${{ steps.mydata.outcome == 'success' && 'my-data' || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/notify.mjs
